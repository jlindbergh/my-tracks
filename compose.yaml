# Local development stack: PostGIS + Martin + Go backend + Vite frontend.
#   docker compose up --build
#   open http://localhost:5173
#
# Only the frontend, the backend and (for psql) the database are published,
# and only on 127.0.0.1. Martin stays on the internal network: tiles must go
# through the backend, which decides whose data they contain.

name: my-tracks

services:
  db:
    build: ./postgis
    environment:
      POSTGRES_DB: mytracks
      POSTGRES_USER: mytracks_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-owner-pw}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev-app-pw}
      MARTIN_DB_PASSWORD: ${MARTIN_DB_PASSWORD:-dev-martin-pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mytracks_owner -d mytracks"]
      interval: 2s
      timeout: 3s
      retries: 30

  martin:
    image: ghcr.io/maplibre/martin:v0.18.1
    command: ["--config", "/config/config.yaml"]
    environment:
      DATABASE_URL: postgres://mytracks_martin:${MARTIN_DB_PASSWORD:-dev-martin-pw}@db:5432/mytracks
    volumes:
      # Mount the directory, not the file: a file mount goes stale when an
      # editor or git replaces the file.
      - ./mapserver:/config:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://mytracks_app:${APP_DB_PASSWORD:-dev-app-pw}@db:5432/mytracks
      MARTIN_URL: http://martin:3000
      LISTEN_ADDR: ":8080"
      # Development only: every request is treated as this user until OIDC login exists.
      AUTH_MODE: dev
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@localhost}
    volumes:
      # Drop your own .gpx files here for batch import (see README).
      - ./samples:/samples:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      martin:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    volumes:
      # The whole module is mounted for hot reload, including vite.config.ts.
      # node_modules stays the image's (installed for Linux) via an anonymous
      # volume; ./dev.sh renews it whenever it rebuilds.
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
